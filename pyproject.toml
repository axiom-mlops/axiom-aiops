[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-aiops"
version = "0.1.0"
description = "Agentic SRE platform: detect -> diagnose -> propose -> human gate -> execute -> verify"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["agent*"]
